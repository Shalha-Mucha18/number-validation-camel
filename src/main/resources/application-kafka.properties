# ==== Optional: use a real Kafka broker instead of SEDA (slides 37-38) ====
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev,kafka
# Needs Kafka on localhost:9092

txnLog.producerUri=kafka:COMSTransactionLogQueue?brokers=localhost:9092
txnLog.consumerUri=kafka:COMSTransactionLogQueue?brokers=localhost:9092&groupId=COMSTransactionLog-consumer-group&consumersCount=3&autoOffsetReset=earliest