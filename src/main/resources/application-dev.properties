# ==== dev environment (slide 8: environment-specific connection settings) ====

# REST entry port (restConfiguration in camel-context.xml)
rest.port=9091

# Fake RMS backend port (mock-backend-routes.xml)
mock.rms.port=9093

# Backend URL used by <to uri="{{rmsURL}}"/>
# Camel 3 uses http:// (Camel 2 / Fuse used http4://)  -> slide 34
rmsURL=http://localhost:9093/mock/rms?bridgeEndpoint=true

# Transaction log: in-memory SEDA queue for local learning
txnLog.producerUri=seda:COMSTransactionLogQueue
txnLog.consumerUri=seda:COMSTransactionLogQueue?concurrentConsumers=2